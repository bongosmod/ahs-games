name: Generate Daily Puzzles

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "America/New_York"

  workflow_dispatch:

jobs:
  generate-puzzles:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAI
        run: |
          pip install openai

      - name: Generate Connections puzzle
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/generate_connections.py

      - name: Save new puzzle
        run: |
          git config user.name "AHS Games Bot"
          git config user.email "actions@github.com"

          git add puzzles/connections.json

          git diff --cached --quiet || git commit -m "Generate daily Connections puzzle"

          git push